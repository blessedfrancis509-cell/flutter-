name: zencash
description: "ZenCash — a pixel-perfect Flutter banking app UI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8

  # Fonts
  google_fonts: ^6.2.1

  # Vector graphics
  flutter_svg: ^2.0.10+1

  # Glassmorphism / blur effects
  glassmorphism: ^3.0.0

  # Subtle UI animations
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  # fonts: (Inter is pulled dynamically via google_fonts,
  # kept here as a placeholder in case you switch to bundled fonts)
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
